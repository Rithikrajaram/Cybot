<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Offline Auth</title>
    <style>
        :root {
            /* Professional Light Theme */
            --bg-color: #f8f9fa;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --accent-color: #0056b3;
            --accent-gradient: linear-gradient(135deg, #0062cc, #004a99);
            --success-color: #28a745;
            --error-color: #dc3545;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
        }

        .nav {
            margin-bottom: 40px;
            background: #ffffff;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }

        .nav a {
            color: #666;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
        }

        .nav a:hover,
        .nav a.active {
            color: var(--accent-color);
            background: rgba(0, 98, 204, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .container {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow-soft);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-color);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            color: #333;
            font-size: 1.05rem;
            font-weight: 500;
            margin-bottom: 25px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 98, 204, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 98, 204, 0.3);
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .alert.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .alert.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        /* Logs Table Support */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            color: #495057;
            background: #f8f9fa;
            padding: 16px;
            border-bottom: 2px solid #dee2e6;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #e9ecef;
            font-size: 0.95rem;
            color: #212529;
            background: #fff;
        }

        .hash {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            color: #e83e8c;
            background: #fff0f6;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Utilities */
        code {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--accent-color);
            font-family: 'Courier New', monospace;
            border: 1px solid var(--glass-border);
        }
    </style>
</head>

<body>
    <div class="nav">
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">Login</a>
        <a href="/register" class="{% if request.path == '/register' %}active{% endif %}">Setup Device</a>
        <a href="/logs" class="{% if request.path == '/logs' %}active{% endif %}">Audit Trail</a>
    </div>

    <div class="container" {% if request.endpoint=='logs' %}style="max-width: 900px;" {% endif %}>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>

</html>
